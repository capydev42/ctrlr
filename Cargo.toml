[package]
name = "ctrlr"
version = "0.11.2"
edition = "2024"
authors = ["Hermann Berket <ger4ik777@gmail.com>"]
description = "Turn your shell history into a searchable command palette"
license = "MIT"
repository = "https://github.com/capydev42/ctrlr"
homepage = "https://github.com/capydev42/ctrlr"
readme = "README.md"
keywords = ["shell", "history", "tui", "cli", "fzf"]
categories = ["command-line-utilities"]
# assets/demo.gif alone is 1.4 MB; none of this belongs in the .crate archive.
exclude = ["assets/", ".github/", ".claude/", "packaging/", "install.sh", "install.ps1", "todo.md", "backup.json"]
# Kept in sync by hand with the MSRV job in .github/workflows/ci.yml.
rust-version = "1.88"

[dependencies]
color-eyre = "0.6.5"
# `use-dev-tty` stays on for every target: the feature only pulls
# `filedescriptor` and `rustix/process`, both of which crossterm already
# declares under `cfg(unix)`, so it is inert on Windows. Splitting this
# into a base entry plus a `[target.'cfg(unix)'.dependencies]` override
# works but churns Cargo.lock for no behavioural gain.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
ratatui = "0.30.0"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
sha1 = "0.10"
fuzzy-matcher = "0.3"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
