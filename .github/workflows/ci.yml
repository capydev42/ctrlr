name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      # The four integration scripts are string literals, so nothing compiles
      # them: a typo only shows up in a user's shell profile. pwsh gets a real
      # parse plus a writer/parser round trip; the others get a syntax check
      # where the shell is installed.
      - name: Shell script syntax check
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          cargo build --quiet
          $work = Join-Path ([System.IO.Path]::GetTempPath()) "ctrlr-scripts"
          New-Item -ItemType Directory -Path $work -Force | Out-Null

          # A throwaway home: the generated scripts point at paths under it,
          # and the next step rewrites one of them. The built binary is
          # invoked directly so cargo keeps the real home.
          $ctrlr = Join-Path $PWD "target/debug/ctrlr"
          $env:HOME = $work

          foreach ($shell in 'bash', 'zsh', 'fish', 'powershell') {
            # Install first: `--print` has to answer whatever the install
            # state is, and returning early on "up to date" is the bug this
            # guards against.
            'y' | & $ctrlr init --shell $shell | Out-Null
            $out = & $ctrlr init --shell $shell --print
            $text = ($out -join "`n")
            $marker = $text.IndexOf("# ctrlr integration")
            if ($marker -lt 0) { throw "$shell printed no script: $text" }
            $path = Join-Path $work "$shell.script"
            Set-Content -LiteralPath $path -Value $text.Substring($marker) -Encoding utf8NoBOM
          }

          # install.ps1 alongside them: it is shipped as a release asset and
          # piped straight into iex, so a typo there breaks installation.
          foreach ($file in (Join-Path $work 'powershell.script'), 'install.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; throw "$file syntax" }
          }

          # zsh and fish are not guaranteed on the runner image.
          $checks = [ordered]@{ bash = '-n'; zsh = '-n'; fish = '--no-execute' }
          foreach ($shell in $checks.Keys) {
            if (Get-Command $shell -ErrorAction SilentlyContinue) {
              & $shell $checks[$shell] (Join-Path $work "$shell.script")
              if ($LASTEXITCODE -ne 0) { throw "$shell syntax check failed" }
              Write-Host "$shell ok"
            } else {
              Write-Host "skipping $shell (not installed)"
            }
          }

      # Proves the writer and `read_runs` still agree on the record format,
      # which a parse check cannot see.
      - name: PowerShell hook writes a parseable record
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $work = Join-Path ([System.IO.Path]::GetTempPath()) "ctrlr-scripts"
          $log = Join-Path $work "runs.log"
          $sourced = Join-Path $work "sourced.ps1"
          $script = Get-Content -LiteralPath (Join-Path $work 'powershell.script') -Raw
          # The generated path points into the throwaway home from the previous
          # step; redirect it to a file this step owns.
          # Single quotes: PowerShell escapes with a backtick, so "\$global"
          # in a double-quoted string interpolates away to nothing.
          $pattern = '(?m)^(\s*\$global:_ctrlrLog = ).*$'
          $script = $script -replace $pattern, ('$1' + "'$log'")
          Set-Content -LiteralPath $sourced -Value $script -Encoding utf8NoBOM

          . $sourced
          _ctrlrWrite 0 '/tmp/dir with space' "echo `"tab`there`" and uml"
          _ctrlrWrite 1 '/tmp' 'false'

          if (-not (Test-Path -LiteralPath $log)) { throw "the hook wrote nothing" }
          "CTRLR_RUN_LOG_FIXTURE=$log" | Out-File -Append -Encoding utf8NoBOM $env:GITHUB_ENV

      - name: Round-trip the fixture through read_runs
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --all-targets fixture_written_by_a_shell_hook_parses

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Release build
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release

      - name: Documentation check
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit