name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ctrlr-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: ctrlr-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ctrlr-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ctrlr-aarch64-apple-darwin.tar.gz
          # No aarch64-pc-windows-msvc: cross-compiling it would need the ARM64
          # MSVC toolset for rusqlite's bundled sqlite3.c, which the image does
          # not guarantee, and ARM64 Windows runs the x86_64 build emulated.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ctrlr-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ${{ matrix.artifact }} ctrlr

      - name: Create artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ctrlr.exe -DestinationPath ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctrlr-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          cp artifacts/*/* artifacts/
          find artifacts -maxdepth 1 -type d ! -name artifacts -exec rm -rf {} \;

      - name: Generate checksums
        run: |
          cd artifacts
          # Both extensions: a zip missing from checksums.txt fails nothing -
          # render-formula.sh only looks up tarballs - so it would ship
          # unverifiable and install.ps1 would have nothing to check against.
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) \
            -exec sha256sum {} \; | sed 's|./||' > checksums.txt

      - name: Print checksums by platform
        run: |
          cd artifacts
          echo "=== Linux ===" && sha256sum *linux-gnu.tar.gz 2>/dev/null || true
          echo "=== macOS ===" && sha256sum *apple-darwin.tar.gz 2>/dev/null || true
          echo "=== Windows ===" && sha256sum *windows-msvc.zip 2>/dev/null || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
            install.sh
            install.ps1
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  homebrew:
    name: Bump Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    # Skipped until the tap exists. To turn it on, set the repository variable
    # HOMEBREW_TAP_REPO to capydev42/homebrew-ctrlr and add a TAP_TOKEN secret:
    # a PAT with contents:write on that repo, because GITHUB_TOKEN is scoped to
    # this one and cannot push to another repository.
    if: vars.HOMEBREW_TAP_REPO != ''
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern checksums.txt

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Render formula
        run: |
          mkdir -p tap/Formula
          bash packaging/homebrew/render-formula.sh \
            "${{ inputs.tag }}" checksums.txt > tap/Formula/ctrlr.rb
          cat tap/Formula/ctrlr.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ctrlr.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, nothing to push"
            exit 0
          fi
          git commit -m "ctrlr ${{ inputs.tag }}"
          git push

  crates-io:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The tag is typed by hand into workflow_dispatch; Cargo.toml is what
      # actually gets published. A mismatch would put a version on crates.io
      # that no git tag points at, and crates.io versions cannot be replaced.
      - name: Check tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "${{ inputs.tag }}" != "v${version}" ]]; then
            echo "::error::tag ${{ inputs.tag }} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_ENV"

      # Makes a re-run of the workflow harmless: publishing an existing
      # version is an error, and the whole job would go red after the fact.
      - name: Skip if already published
        run: |
          if curl -sfA "ctrlr-release-workflow" \
               "https://crates.io/api/v1/crates/ctrlr/${version}" >/dev/null; then
            echo "ctrlr ${version} is already on crates.io"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Publish
        if: env.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
